<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon | VOX Studio</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
}


.wave {
    display: flex;
    gap: 6px;
    height: 60px;
    align-items: flex-end;
}
.bar {
    width: 6px;
    background: #22c55e;
    animation: wave 1s infinite ease-in-out;
}
.bar:nth-child(2){animation-delay:.1s}
.bar:nth-child(3){animation-delay:.2s}
.bar:nth-child(4){animation-delay:.3s}
.bar:nth-child(5){animation-delay:.4s}

@keyframes wave {
    0%,100%{height:10px}
    50%{height:60px}
}


.bg-animate {
    background: radial-gradient(circle at 20% 20%, rgba(34,197,94,0.2), transparent),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,0.2), transparent);
    animation: moveBg 8s linear infinite alternate;
}
@keyframes moveBg {
    from {background-position:0 0,100% 100%;}
    to {background-position:100% 100%,0 0;}
}


.glass {
    backdrop-filter: blur(15px);
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
}
</style>
</head>

<body class="bg-gray-900 text-white bg-animate transition duration-500">


<button onclick="toggleTheme()" class="absolute top-5 right-5 px-4 py-2 bg-white text-black rounded-full text-sm">
    Toggle
</button>

<a href="/" 
   class="mt-6 inline-block px-6 py-3 bg-green-500 hover:bg-green-600 rounded-full font-semibold shadow-lg transition">
   🏠 Back to Home
</a>

<div class="min-h-screen flex flex-col justify-center items-center text-center px-6">

    
    <div class="wave mb-6">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    
    <h1 class="text-5xl md:text-7xl font-bold mb-4">
        🎙️ VOX Studio
    </h1>

    <h2 class="text-2xl md:text-3xl mb-4 font-semibold">
        We're Crafting Something Amazing
    </h2>

    <p class="text-gray-400 max-w-md mb-8">
        Our studio is in production mode 🎧  
        Stay tuned for premium voiceovers, dubbing & audio magic.
    </p>

    
    <div class="flex gap-6 mb-10 text-center">
        <div>
            <p id="days" class="text-3xl font-bold">00</p>
            <span class="text-sm text-gray-400">Days</span>
        </div>
        <div>
            <p id="hours" class="text-3xl font-bold">00</p>
            <span class="text-sm text-gray-400">Hours</span>
        </div>
        <div>
            <p id="minutes" class="text-3xl font-bold">00</p>
            <span class="text-sm text-gray-400">Minutes</span>
        </div>
        <div>
            <p id="seconds" class="text-3xl font-bold">00</p>
            <span class="text-sm text-gray-400">Seconds</span>
        </div>
    </div>

    
    <div class="glass p-6 rounded-2xl w-full max-w-md">
        <p class="mb-4 font-medium">Get notified when we launch 🚀</p>
        <div class="flex gap-2">
            <input type="email" placeholder="Enter your email"
                class="flex-1 px-4 py-2 rounded-full text-black outline-none">
            <button onclick="subscribe()" 
                class="px-4 py-2 bg-green-500 hover:bg-green-600 rounded-full">
                Join
            </button>
        </div>
    </div>
    

    
    <button onclick="playSound()" class="mt-8 text-sm text-gray-400 hover:text-white">
        🔊 Tap for Studio Sound
    </button>

    <p class="text-gray-500 text-sm mt-10">
        © 2026 VOX Studio • Audio Production
    </p>
</div>

<audio id="sound">
    <source src="../services/audio/sample2.mp3" type="audio/mp3">
</audio>

<script>

const launchDate = new Date("April 30, 2026 00:00:00").getTime();

setInterval(() => {
    const now = new Date().getTime();
    const gap = launchDate - now;

    const d = Math.floor(gap / (1000 * 60 * 60 * 24));
    const h = Math.floor((gap / (1000 * 60 * 60)) % 24);
    const m = Math.floor((gap / (1000 * 60)) % 60);
    const s = Math.floor((gap / 1000) % 60);

    document.getElementById("days").innerText = d;
    document.getElementById("hours").innerText = h;
    document.getElementById("minutes").innerText = m;
    document.getElementById("seconds").innerText = s;
}, 1000);


function subscribe() {
    alert("You're on the list 🎉");
}


function playSound() {
    document.getElementById("sound").play();
}


function toggleTheme() {
    document.body.classList.toggle("bg-gray-900");
    document.body.classList.toggle("bg-white");
    document.body.classList.toggle("text-white");
    document.body.classList.toggle("text-black");
}
</script>

</body>
</html>
