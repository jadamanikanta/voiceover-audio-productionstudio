<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="64x64" href="../global-images/logo.png">
  <title>Login - VoxStudio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = {
      darkMode: 'class'
    }
  </script>

  <style>
    
    .bar {
      width: 4px;
      height: 20px;
      background: #a855f7;
      animation: equalize 1s infinite ease-in-out;
    }
    .bar:nth-child(2) { animation-delay: 0.2s; }
    .bar:nth-child(3) { animation-delay: 0.4s; }
    .bar:nth-child(4) { animation-delay: 0.6s; }
    .bar:nth-child(5) { animation-delay: 0.8s; }

    @keyframes equalize {
      0%, 100% { height: 10px; }
      50% { height: 40px; }
    }

    
    .pulse-ring {
      position: absolute;
      border-radius: 50%;
      border: 2px solid rgba(168,85,247,0.4);
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.8); opacity: 1; }
      100% { transform: scale(2); opacity: 0; }
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden transition duration-500 bg-white text-black dark:bg-black dark:text-white">


<div class="pulse-ring w-72 h-72"></div>
<div class="pulse-ring w-96 h-96"></div>


<div class="absolute top-6 left-6 flex gap-1 opacity-70">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>


<div class="absolute top-4 right-4 flex gap-3 z-10">
  <button onclick="toggleRTL()" class="px-3 py-1 border rounded-lg text-sm">
    RTL
  </button>
  <button onclick="toggleDark()" class="p-2 border rounded-lg">
    <i data-lucide="moon"></i>
  </button>
</div>


<div class="relative z-10 w-full max-w-md p-8 rounded-2xl shadow-2xl backdrop-blur-lg 
bg-white/80 dark:bg-white/10 border border-gray-200 dark:border-white/20">

  
  <h1 onclick="goHome()" 
      class="text-3xl font-bold text-center cursor-pointer mb-6 tracking-wide 
      hover:text-purple-500 transition">
    🎙 VoxStudio
  </h1>

  
  <form class="flex flex-col gap-4">

    
    <input type="email" placeholder="Email"
      class="w-full p-3 rounded-lg border 
      bg-white text-black border-gray-300 
      dark:bg-black/40 dark:text-white dark:border-gray-600 
      focus:outline-none focus:ring-2 focus:ring-purple-500 
      focus:shadow-lg focus:shadow-purple-500/20 transition">

    
    <div class="relative">
      <input id="password" type="password" placeholder="Password"
        class="w-full p-3 rounded-lg border 
        bg-white text-black border-gray-300 
        dark:bg-black/40 dark:text-white dark:border-gray-600 
        focus:ring-2 focus:ring-purple-500 
        focus:shadow-lg focus:shadow-purple-500/20 transition">

      <i onclick="togglePassword()" data-lucide="eye"
        class="absolute right-3 top-3 cursor-pointer text-gray-500 dark:text-gray-300"></i>
    </div>

    
    <div class="flex justify-between text-sm">
      <label class="flex items-center gap-2">
        <input type="checkbox"> Remember Me
      </label>
      <a href="#" class="text-purple-500 hover:underline">Forgot Password?</a>
    </div>

    
    <button class="w-full bg-purple-600 hover:bg-purple-700 text-white p-3 rounded-lg transition shadow-lg shadow-purple-600/30">
      Login
    </button>

    
    <div class="text-center text-gray-500 dark:text-gray-400">or</div>

    
    <div class="flex flex-col gap-3">
      <button class="w-full flex items-center justify-center gap-2 border p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition">
        <i data-lucide="chrome"></i> Continue with Google
      </button>
      <button class="w-full flex items-center justify-center gap-2 border p-3 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition">
        <i data-lucide="apple"></i> Continue with Apple
      </button>
    </div>

    
    <p class="text-center text-sm">
      Don’t have an account?
      <a href="../signup.html" class="text-purple-500">Sign Up</a>
    </p>

  </form>
</div>

<script>
lucide.createIcons();

function togglePassword() {
  const input = document.getElementById("password");
  input.type = input.type === "password" ? "text" : "password";
}

function toggleRTL() {
  document.documentElement.dir =
    document.documentElement.dir === "rtl" ? "ltr" : "rtl";
}

function toggleDark() {
  document.documentElement.classList.toggle("dark");
}

function goHome() {
  window.location.href = "../index.html";
}
</script>

</body>
</html>
