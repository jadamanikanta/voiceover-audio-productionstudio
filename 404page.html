<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 | VOX Studio</title>


<script src="https://cdn.tailwindcss.com"></script>


<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<style>
body {
    font-family: 'Poppins', sans-serif;
}


.wave {
    display: flex;
    gap: 5px;
    align-items: flex-end;
    height: 60px;
}

.bar {
    width: 6px;
    background: #22c55e;
    animation: waveAnim 1s infinite ease-in-out;
}

.bar:nth-child(2) { animation-delay: 0.1s; }
.bar:nth-child(3) { animation-delay: 0.2s; }
.bar:nth-child(4) { animation-delay: 0.3s; }
.bar:nth-child(5) { animation-delay: 0.4s; }

@keyframes waveAnim {
    0%, 100% { height: 10px; }
    50% { height: 60px; }
}


.glow {
    text-shadow: 0 0 20px rgba(34,197,94,0.8);
}


.bg-animate {
    background: radial-gradient(circle at 20% 20%, rgba(34,197,94,0.15), transparent),
                radial-gradient(circle at 80% 80%, rgba(59,130,246,0.15), transparent);
    animation: moveBg 8s linear infinite alternate;
}

@keyframes moveBg {
    from { background-position: 0 0, 100% 100%; }
    to { background-position: 100% 100%, 0 0; }
}
</style>
</head>

<body class="bg-gray-900 text-white bg-animate transition duration-500">


<div class="absolute top-5 right-5">
    <button onclick="toggleTheme()" class="px-4 py-2 bg-white text-black rounded-full text-sm font-semibold">
        Toggle Mode
    </button>
</div>


<div class="min-h-screen flex flex-col justify-center items-center text-center px-6">

    
    <div class="wave mb-6">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
    </div>

    
    <h1 class="text-7xl md:text-9xl font-bold glow">404</h1>

    <h2 class="text-2xl md:text-3xl mt-4 font-semibold">
        Lost in the Soundscape 🎙️
    </h2>

    <p class="text-gray-400 mt-3 max-w-md">
        The page you're looking for has gone silent…  
        Maybe it's still in post-production or got muted.
    </p>

    
    <div class="mt-8 flex gap-4 flex-wrap justify-center">
        <a href="../index.html" class="px-6 py-3 bg-green-500 hover:bg-green-600 rounded-full font-semibold shadow-lg transition">
            🎧 Back to Studio
        </a>

        <button onclick="playSound()" class="px-6 py-3 border border-gray-500 hover:bg-gray-800 rounded-full transition">
            🔊 Play Sound
        </button>
    </div>

    
    <p class="text-gray-500 text-sm mt-12">
        VOX Studio • Premium Audio Production
    </p>

</div>


<audio id="errorSound">
    <source src="../services/audio/sample3.mp3" type="audio/mp3">
</audio>

<script>

function playSound() {
    document.getElementById("errorSound").play();
}


function toggleTheme() {
    document.body.classList.toggle("bg-gray-900");
    document.body.classList.toggle("bg-white");
    document.body.classList.toggle("text-white");
    document.body.classList.toggle("text-black");
}
</script>

</body>
</html>
