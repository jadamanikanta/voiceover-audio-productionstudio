<!DOCTYPE html>

<html lang="en" dir="ltr" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - VoxStudio</title>


<link rel="icon" type="image/png" sizes="64x64" href="../global-images/logo.png">

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>

<script>
    tailwind.config = {
        darkMode: 'class'
    }
</script>

<style>
    :root {
    
    --primary: #f59e0b;
    --text-color:rgb(7, 7, 7);

}

body.dark-mode {
    
    --primary: #f59e0b;

    --text-color:rgb(252, 251, 251);
   
}

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .bar {
        width: 4px;
        height: 20px;
        background: #888;
        animation: equalize 1s infinite ease-in-out;
    }

    .bar:nth-child(2) { animation-delay: .2s; }
    .bar:nth-child(3) { animation-delay: .4s; }
    .bar:nth-child(4) { animation-delay: .6s; }
    .bar:nth-child(5) { animation-delay: .8s; }

    @keyframes equalize {
        0%,100% { height: 10px; }
        50% { height: 40px; }
    }

   

    .logo-wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-decoration: none;
        transition: .3s;
    }

    .logo-wrap:hover {
        opacity: .8;
    }

    .logo-wrap svg{
            width: 25px;
            height: 25px;
            color: currentColor;
        }

    .logo-text {
        font-size: clamp(24px, 4vw, 34px);
        font-weight: 700;
        letter-spacing: 1px;
        color:var(--primary);
    }

    

   .signup-card {
    max-height: 95vh;
    overflow: hidden;
}

/* Mobile */
@media (max-width:480px) {

    body {
        padding: 10px;
    }

    .controls {
        top: 10px;
        right: 10px;
    }

    .signup-card {
        padding: 16px !important;
        border-radius: 18px;
    }

    .logo-text {
        font-size: 24px;
    }

    .signup-card input,
    .signup-card button {
        height: 42px !important;
    }
}

/* Tablet */
@media (min-width:768px) {
    .signup-card {
        max-width: 540px;
        padding: 22px !important;
    }
}

@media (min-width:1024px) {

    .signup-card {
        width: 100%;
        max-width: 500px;
        padding: 15px 40px !important;
        border-radius: 28px;
    }

    .logo-text {
        font-size: 25px;
    }

    .signup-card input,
    .signup-card button {
        height: 40px !important;
    }

    .signup-card h2 {
        font-size: 20px;
    }
}
</style>


</head>

<body class="h-screen flex items-center justify-center relative overflow-hidden bg-white text-black dark:bg-black dark:text-white transition px-3">

<!-- Audio Bars -->
<div class="absolute top-6 left-6 flex gap-1 opacity-60">
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
    <div class="bar"></div>
</div>

<!-- Controls -->
<div class="controls fixed top-4 right-4 flex gap-2 z-50">

    <button onclick="toggleRTL()"
        class="px-3 py-2 border border-gray-300 dark:border-gray-700 rounded-lg text-sm hover:bg-gray-100 dark:hover:bg-white/10 transition">
        RTL
    </button>

    <button onclick="toggleDark()"
    class="p-2 border border-gray-300 dark:border-gray-700 rounded-lg hover:bg-gray-100 dark:hover:bg-white/10 transition">
    <i id="themeIcon" data-lucide="moon"></i>
</button>

</div>

<!-- Signup Card -->
<div
    class="signup-card relative z-10 w-full max-w-md md:max-w-lg lg:max-w-xl rounded-3xl p-5 md:p-8 lg:p-10 shadow-2xl backdrop-blur-xl bg-white/90 dark:bg-white/5 border border-gray-200 dark:border-white/10">
    <!-- Logo -->
    <a href="../index.html" class="logo-wrap mb-4">
        <i data-lucide="mic" class="logo-icon"></i>

       <span class="logo-text">
    VOX<b class="text-black dark:text-white">Studio</b>
</span>
    </a>

    <!-- Heading -->
    <h2 class="text-xl md:text-2xl font-bold text-center mb-2">
        Create Account
    </h2>

    <p class="text-center text-sm md:text-base text-gray-500 dark:text-gray-400 mb-6">
        Join VoxStudio and start creating
    </p>

    <!-- Form -->
    <form class="space-y-3">

        <input type="text" placeholder="Full Name"
            class="w-full h-12 px-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 focus:shadow-lg focus:shadow-gray-500/20 transition">

        <input type="email" placeholder="Email Address"
            class="w-full h-12 px-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 focus:shadow-lg focus:shadow-gray-500/20 transition">

        <div class="relative">
            <input id="password" type="password" placeholder="Password"
                class="w-full h-12 px-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 focus:shadow-lg focus:shadow-gray-500/20 transition">

            <i onclick="togglePassword()"
                data-lucide="eye"
                class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500">
            </i>
        </div>

        <div class="relative">
            <input id="confirmPassword" type="password" placeholder="Confirm Password"
                class="w-full h-12 px-4 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white focus:outline-none focus:ring-2 focus:ring-gray-500 focus:shadow-lg focus:shadow-gray-500/20 transition">

            <i onclick="toggleConfirmPassword()"
                data-lucide="eye"
                class="absolute right-4 top-1/2 -translate-y-1/2 cursor-pointer text-gray-500">
            </i>
        </div>

        <button type="submit"
            class="w-full h-12 rounded-lg font-medium transition bg-black text-white hover:bg-gray-800 dark:bg-white dark:text-black dark:hover:bg-gray-200">
            Create Account
        </button>

        <!-- Divider -->
        <div class="relative my-3">
            <div class="border-t border-gray-300 dark:border-gray-700"></div>

            <span class="absolute left-1/2 -translate-x-1/2 -top-3 px-3 bg-white dark:bg-black text-sm text-gray-500">
                OR
            </span>
        </div>

        <!-- Google -->
        <button type="button"
            class="w-full h-12 flex items-center justify-center gap-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white hover:bg-gray-50 dark:hover:bg-white/10 transition">

            <svg width="18" height="18" viewBox="0 0 48 48">
                <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12S17.4 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C33.9 6.1 29.2 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/>
                <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.3 19 12 24 12c3 0 5.7 1.1 7.8 2.9l5.7-5.7C33.9 6.1 29.2 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
                <path fill="#4CAF50" d="M24 44c5.1 0 9.8-2 13.3-5.2l-6.1-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.5 39.5 16.2 44 24 44z"/>
                <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.4 5.7-6.2 7.4l6.1 5.2C39.7 36.5 44 30.8 44 24c0-1.3-.1-2.4-.4-3.5z"/>
            </svg>

            Google
        </button>

        <!-- Apple -->
        <button type="button"
            class="w-full h-12 flex items-center justify-center gap-3 rounded-lg border border-gray-300 dark:border-gray-600 bg-white dark:bg-black/40 text-black dark:text-white hover:bg-gray-50 dark:hover:bg-white/10 transition">

            <i data-lucide="apple"></i>
            Apple

        </button>

        <p class="text-center text-sm pt-2">
            Already have an account?
            <a href="../login.html" class="font-semibold hover:underline">
                Login
            </a>
        </p>

    </form>

</div>

<script>
    lucide.createIcons();

    function togglePassword() {
        const input = document.getElementById("password");
        input.type = input.type === "password" ? "text" : "password";
    }

    function toggleConfirmPassword() {
        const input = document.getElementById("confirmPassword");
        input.type = input.type === "password" ? "text" : "password";
    }

    function toggleRTL() {
        document.documentElement.dir =
            document.documentElement.dir === "rtl" ? "ltr" : "rtl";
    }

    function toggleDark() {
        document.documentElement.classList.toggle("dark");

        const isDark = document.documentElement.classList.contains("dark");
        const icon = document.getElementById("themeIcon");

        icon.setAttribute(
            "data-lucide",
            isDark ? "sun" : "moon"
        );

        lucide.createIcons();
    }
</script>


</body>

</html>
