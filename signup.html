<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOX Studio Auth</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
@keyframes waveform {
    0%,100% { height: 20px; }
    50% { height: 60px; }
}

.wave span {
    animation: waveform 1s infinite ease-in-out;
}

.wave span:nth-child(2){ animation-delay:0.1s; }
.wave span:nth-child(3){ animation-delay:0.2s; }
.wave span:nth-child(4){ animation-delay:0.3s; }
.wave span:nth-child(5){ animation-delay:0.4s; }

@keyframes pulseMic {
    0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(34,211,238,0.5);}
    70% { transform: scale(1.08); box-shadow: 0 0 0 20px rgba(34,211,238,0);}
    100% { transform: scale(1);}
}

.mic-pulse {
    animation: pulseMic 2s infinite;
}

.particle {
    position: absolute;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    animation: float 10s infinite linear;
}

@keyframes float {
    from { transform: translateY(0px); }
    to { transform: translateY(-100vh); }
}
</style>
</head>

<body class="bg-slate-950 min-h-screen flex items-center justify-center overflow-hidden relative">

<div class="particle w-3 h-3 left-10 bottom-10"></div>
<div class="particle w-4 h-4 left-1/3 bottom-20"></div>
<div class="particle w-2 h-2 right-20 bottom-10"></div>
<div class="particle w-5 h-5 right-1/4 bottom-16"></div>

<a href="index.html"
   class="absolute top-8 left-8 z-20 px-5 py-3 rounded-xl bg-white/10 text-white backdrop-blur-md hover:bg-cyan-500 transition">
   ← Back Home
</a>

<div class="relative z-10 max-w-6xl w-full mx-6 grid md:grid-cols-2 rounded-3xl overflow-hidden shadow-2xl border border-white/10 bg-white/10 backdrop-blur-xl">

    
    <div class="hidden md:flex flex-col justify-center items-center bg-gradient-to-br from-cyan-500/20 to-blue-500/10 p-14 relative text-white">

        <h1 class="text-5xl font-bold mb-5">VOX Studio</h1>

        <p class="text-lg text-slate-300 text-center max-w-md leading-8 mb-10">
            Professional voiceover, dubbing, podcast editing and premium audio production platform.
        </p>

        <div class="mic-pulse w-28 h-28 rounded-full bg-cyan-400/20 flex items-center justify-center text-5xl mb-10">
            🎙️
        </div>

        <div class="wave flex gap-2 items-end h-20">
            <span class="w-3 bg-cyan-400 rounded-full"></span>
            <span class="w-3 bg-cyan-400 rounded-full"></span>
            <span class="w-3 bg-cyan-400 rounded-full"></span>
            <span class="w-3 bg-cyan-400 rounded-full"></span>
            <span class="w-3 bg-cyan-400 rounded-full"></span>
        </div>
    </div>

    
    <div class="p-12 md:p-14 text-white bg-slate-900/50">

        <div class="flex gap-4 mb-10">
            <button id="loginTab" class="bg-cyan-500 px-7 py-3 rounded-xl font-semibold shadow-lg shadow-cyan-500/20">Login</button>
            <button id="registerTab" class="bg-white/10 px-7 py-3 rounded-xl font-semibold hover:bg-white/20 transition">Register</button>
        </div>

        
        <div id="loginForm" class="space-y-6">

            <h2 class="text-4xl font-bold mb-8">Welcome Back</h2>

            <input type="email" placeholder="Email Address"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-400">

            <div class="relative">
                <input type="password" placeholder="Password"
                    class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-400">
                <span class="absolute right-4 top-4 text-slate-400 cursor-pointer">👁️</span>
            </div>

            <button class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 p-4 rounded-2xl font-semibold hover:scale-105 transition shadow-lg shadow-cyan-500/20">
                Login
            </button>

            
            <div class="grid grid-cols-2 gap-4 pt-3">

                <button class="flex items-center justify-center gap-3 bg-white/10 p-4 rounded-2xl hover:bg-red-500/20 transition border border-white/10 hover:scale-105">
                    <img src="https://cdn-icons-png.flaticon.com/512/300/300221.png" class="w-5 h-5">
                    Google
                </button>

                <button class="flex items-center justify-center gap-3 bg-white/10 p-4 rounded-2xl hover:bg-blue-500/20 transition border border-white/10 hover:scale-105">
                    <img src="https://cdn-icons-png.flaticon.com/512/174/174857.png" class="w-5 h-5">
                    LinkedIn
                </button>

            </div>
        </div>

        
        <div id="registerForm" class="space-y-6 hidden">

            <h2 class="text-4xl font-bold mb-8">Create Account</h2>

            <input type="text" placeholder="Full Name"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-400">

            <input type="email" placeholder="Email Address"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-400">

            <input type="password" placeholder="Password"
                class="w-full p-4 rounded-2xl bg-white/10 border border-white/10 focus:outline-none focus:ring-2 focus:ring-cyan-400">

            <button class="w-full bg-gradient-to-r from-cyan-500 to-blue-500 p-4 rounded-2xl font-semibold hover:scale-105 transition shadow-lg shadow-cyan-500/20">
                Register
            </button>
        </div>

    </div>
</div>

<script>
const loginTab = document.getElementById('loginTab');
const registerTab = document.getElementById('registerTab');
const loginForm = document.getElementById('loginForm');
const registerForm = document.getElementById('registerForm');

loginTab.onclick = () => {
    loginForm.classList.remove('hidden');
    registerForm.classList.add('hidden');
    loginTab.classList.add('bg-cyan-500');
    registerTab.classList.remove('bg-cyan-500');
};

registerTab.onclick = () => {
    registerForm.classList.remove('hidden');
    loginForm.classList.add('hidden');
    registerTab.classList.add('bg-cyan-500');
    loginTab.classList.remove('bg-cyan-500');
};
</script>

</body>
</html>
