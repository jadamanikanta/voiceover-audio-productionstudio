<!DOCTYPE html>
<html lang="en" dir="ltr" class="dark">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/png" sizes="64x64" href="../global-images/logo.png">
  <title>Sign Up - VoxStudio</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script>
    tailwind.config = { darkMode: 'class' }
  </script>

  <style>
    
    .wave-bg {
      position: absolute;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        120deg,
        transparent 30%,
        rgba(99,102,241,0.15) 50%,
        transparent 70%
      );
      animation: waveMove 8s linear infinite;
    }

    @keyframes waveMove {
      0% { transform: translateX(-50%) translateY(-50%) rotate(0deg); }
      100% { transform: translateX(-30%) translateY(-50%) rotate(360deg); }
    }

    
    .bar {
      width: 3px;
      height: 14px;
      background: #6366f1;
      animation: eq 1s infinite ease-in-out;
    }

    .bar:nth-child(2){animation-delay:.2s}
    .bar:nth-child(3){animation-delay:.4s}
    .bar:nth-child(4){animation-delay:.6s}

    @keyframes eq {
      0%,100%{height:8px}
      50%{height:18px}
    }
  </style>
</head>

<body class="min-h-screen flex items-center justify-center relative overflow-hidden 
bg-white text-black dark:bg-black dark:text-white transition">


<div class="wave-bg"></div>


<div class="absolute top-4 left-4 flex gap-1 opacity-60">
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
  <div class="bar"></div>
</div>


<div class="absolute top-4 right-4 flex gap-2 z-10">
  <button onclick="toggleRTL()" class="px-2 py-1 border rounded text-xs">
    RTL
  </button>
  <button onclick="toggleDark()" class="p-2 border rounded">
    <i data-lucide="moon"></i>
  </button>
</div>


<div class="relative z-10 w-full max-w-sm p-6 rounded-xl shadow-xl backdrop-blur-md
bg-white/80 dark:bg-white/10 border border-gray-200 dark:border-white/20">

  
  <h1 onclick="goHome()" 
      class="text-xl font-bold text-center cursor-pointer mb-4 hover:text-indigo-500">
    🎧 VoxStudio
  </h1>

  
  <form class="flex flex-col gap-3">

    
    <input type="text" placeholder="Full Name"
      class="w-full p-2.5 text-sm rounded-md border 
      bg-white text-black border-gray-300 
      dark:bg-black/40 dark:text-white dark:border-gray-600 
      focus:ring-2 focus:ring-indigo-500 transition">

    
    <input type="email" placeholder="Email"
      class="w-full p-2.5 text-sm rounded-md border 
      bg-white text-black border-gray-300 
      dark:bg-black/40 dark:text-white dark:border-gray-600 
      focus:ring-2 focus:ring-indigo-500 transition">

    
    <div class="relative">
      <input id="password" type="password" placeholder="Password"
        class="w-full p-2.5 text-sm rounded-md border 
        bg-white text-black border-gray-300 
        dark:bg-black/40 dark:text-white dark:border-gray-600 
        focus:ring-2 focus:ring-indigo-500 transition">

      <i onclick="togglePassword()" data-lucide="eye"
        class="absolute right-2 top-2.5 w-4 h-4 cursor-pointer text-gray-500"></i>
    </div>

    
    <div class="relative">
      <input id="confirmPassword" type="password" placeholder="Confirm Password"
        class="w-full p-2.5 text-sm rounded-md border 
        bg-white text-black border-gray-300 
        dark:bg-black/40 dark:text-white dark:border-gray-600 
        focus:ring-2 focus:ring-indigo-500 transition">

      <i onclick="toggleConfirmPassword()" data-lucide="eye"
        class="absolute right-2 top-2.5 w-4 h-4 cursor-pointer text-gray-500"></i>
    </div>

    
    <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-2.5 text-sm rounded-md transition">
      Create Account
    </button>

    
    <div class="text-center text-xs text-gray-500">or</div>

    
    <button class="w-full flex items-center justify-center gap-3 p-2.5 text-sm rounded-md 
border border-gray-300 dark:border-gray-600 
bg-white dark:bg-black/40 
hover:bg-gray-100 dark:hover:bg-white/10 
transition shadow-sm">

  
  <svg class="w-4 h-4" viewBox="0 0 48 48">
    <path fill="#EA4335" d="M24 9.5c3.54 0 6.72 1.22 9.23 3.6l6.9-6.9C35.68 2.3 30.2 0 24 0 14.82 0 6.9 5.48 3.36 13.44l8.06 6.26C13.36 13.26 18.27 9.5 24 9.5z"/>
    <path fill="#4285F4" d="M46.5 24c0-1.64-.14-3.2-.4-4.7H24v9h12.7c-.55 2.9-2.2 5.36-4.7 7.04l7.24 5.64C43.98 36.44 46.5 30.7 46.5 24z"/>
    <path fill="#FBBC05" d="M11.42 28.7a14.5 14.5 0 010-9.4l-8.06-6.26A24 24 0 000 24c0 3.9.94 7.6 2.6 10.9l8.82-6.2z"/>
    <path fill="#34A853" d="M24 48c6.2 0 11.4-2.04 15.2-5.54l-7.24-5.64c-2.02 1.36-4.6 2.18-7.96 2.18-5.73 0-10.64-3.76-12.38-8.96l-8.82 6.2C6.9 42.52 14.82 48 24 48z"/>
  </svg>

  Continue with Google
</button>

    <button class="w-full flex items-center justify-center gap-3 p-2.5 text-sm rounded-md 
border border-gray-300 dark:border-gray-600 
bg-black text-white 
hover:bg-gray-900 
transition shadow-sm">

  
  <svg class="w-4 h-4 fill-white" viewBox="0 0 24 24">
    <path d="M16.365 1.43c0 1.14-.41 2.2-1.1 3-.74.86-1.95 1.52-3.1 1.42-.14-1.1.44-2.27 1.13-3.04.77-.87 2.1-1.5 3.07-1.38zM20.5 17.3c-.57 1.3-.84 1.88-1.57 3.05-1.02 1.63-2.46 3.66-4.23 3.67-1.57.02-1.97-1.03-4.1-1.02-2.13.01-2.56 1.04-4.13 1.02-1.77-.02-3.14-1.86-4.16-3.49C.7 18.2 0 14.94 1.66 12.3c1.18-1.9 3.3-3.1 5.6-3.1 1.75 0 2.85 1.05 4.3 1.05 1.4 0 2.25-1.05 4.3-1.05 2 0 4.12 1.08 5.3 2.94-4.68 2.57-3.92 9.2.34 5.16z"/>
  </svg>

  Continue with Apple
</button>

    <p class="text-center text-xs">
      Already have an account?
      <a href="../login.html" class="text-indigo-500">Login</a>
    </p>

  </form>
</div>

<script>
lucide.createIcons();

function togglePassword(){
  const i=document.getElementById("password");
  i.type=i.type==="password"?"text":"password";
}

function toggleConfirmPassword(){
  const i=document.getElementById("confirmPassword");
  i.type=i.type==="password"?"text":"password";
}

function toggleRTL(){
  document.documentElement.dir=
  document.documentElement.dir==="rtl"?"ltr":"rtl";
}

function toggleDark(){
  document.documentElement.classList.toggle("dark");
}

function goHome(){
  window.location.href="../index.html";
}
</script>

</body>
</html>
